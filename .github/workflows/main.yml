name: Main

permissions:
  contents: read

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8,20 * * *"

jobs:
  unit-tests:
    name: Unit tests
    uses: ./.github/workflows/unit_tests.yml
    with:
      linux_6_2_arguments_override: "-Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error"
      linux_6_3_arguments_override: "-Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error"
      linux_nightly_next_arguments_override: "-Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error"
      linux_nightly_main_arguments_override: "-Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error"

  release-builds:
    name: Release builds
    uses: ./.github/workflows/release_builds.yml

  static-sdk:
    name: Static SDK
    uses: apple/swift-nio/.github/workflows/static_sdk.yml@main

  gssapi-build:
    name: GSSAPI opt-in build
    runs-on: ubuntu-latest
    container:
      image: swift:6.2-jammy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
      - name: Mark the workspace as safe
        # https://github.com/actions/checkout/issues/766
        run: git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - name: Install Cyrus SASL headers
        run: apt-get -qq update && apt-get -qq -y install libsasl2-dev
      - name: Build with GSSAPI enabled (opt-in Cyrus SASL path)
        run: SWIFT_KAFKA_ENABLE_GSSAPI=1 swift build

  apple-simulator-builds:
    name: ${{ matrix.platform }} Simulator build
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            sdk: iphonesimulator
            triple: arm64-apple-ios-simulator
          - platform: tvOS
            sdk: appletvsimulator
            triple: arm64-apple-tvos-simulator
          - platform: watchOS
            sdk: watchsimulator
            triple: arm64-apple-watchos-simulator
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
      - name: Build for the ${{ matrix.platform }} Simulator
        # These SDKs lack headers that the macOS SDK ships (e.g. curl/curl.h), so a
        # librdkafka build-config regression can pass the macOS and Linux builds but break them.
        run: |
          "$(xcrun -f swift)" build --sdk "$(xcrun --sdk ${{ matrix.sdk }} --show-sdk-path)" --triple ${{ matrix.triple }}
